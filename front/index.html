<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telinha</title>

    <!-- BootStrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- java script -->
    <script src="codigin.js"></script>

    <!--Style-->
    <style>
        form{
            width: 50%;
            margin: 30px auto;
            text-align: center;
        }

        input{
            margin-bottom: 10px;
        }

        #btnAlterar, #btnRemover, #btnCancelar{
            display: none;
        }
    </style>

</head>
<body>
    <!-- Formulário-->
     <form> 
        <input type="text" id="nome" class="form-control" placeholder="Informe um nome">
        <input type="text" id="cidade" class="form-control" placeholder="Informe uma cidade">
        <input type="text" id="idade" class="form-control" placeholder="Informe uma idade">

        <input type="button" value="Cadastrar" onclick="cadastrar()" id="btnCadastrar" class="btn btn-primary">
        <input type="button" value="Alterar" onclick="alterar()" id="btnAlterar" class="btn btn-primary">
        <input type="button" value="Remover" onclick="remover()" id="btnRemover" class="btn btn-primary">
        <input type="button" value="Cancelar" onclick="cancelar()" id="btnCancelar" class="btn btn-primary">
     </form>

       <!-- Tabela -->
<table class="table">
        <thead>
            <tr>
                <th>#</th>
                <th>Nome</th>
                <th>Cidade</th>
                <th>Idade</th>
                <th>Selecionar</th>
            </tr>
        </thead>

        <tbody id="tabela"></tbody>
</table>
</body>
</html>
